# ─── Dev Profile: H2 in-memory database (no MySQL required) ───────────────────
spring:
  datasource:
    url: jdbc:h2:mem:user_management_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Enable H2 console at /api/v1/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.usermanagement: DEBUG

